{% extends "admin/base.html" %}
{% block title %}Login{% endblock %}
{% block auth %}
<div class="mx-auto" style="max-width:420px">
  <div class="text-center mb-4"><i class="bi bi-shield-lock fs-1 brand-text"></i><h3>Admin Panel</h3><p class="text-muted small">{{ settings.store_name }}</p></div>
  <div class="card border-0 shadow-sm"><div class="card-body p-4">
    <form method="post">
      {{ csrf_field() }}
      <div class="mb-3"><label class="form-label">Admin email</label><input type="email" name="email" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-brand w-100">Sign in</button>
    </form>
  </div></div>
  <p class="text-center mt-3 small"><a href="{{ url_for('shop.home') }}">&larr; Back to store</a></p>
</div>
{% endblock %}
