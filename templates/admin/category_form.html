{% extends "admin/base.html" %}
{% block title %}Edit category{% endblock %}
{% block content %}
<h4 class="mb-3">Edit category</h4>
<div class="card border-0 shadow-sm" style="max-width:560px"><div class="card-body">
  <form method="post">{{ csrf_field() }}
    <div class="mb-3"><label class="form-label">Name</label><input name="name" class="form-control" required value="{{ category.name }}"></div>
    <div class="mb-3"><label class="form-label">Description</label><textarea name="description" class="form-control" rows="3">{{ category.description }}</textarea></div>
    {% set current_icon = category.icon or 'grid' %}{% include "admin/_icon_picker.html" %}
    <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" name="active" id="active" {{ 'checked' if category.active }}><label class="form-check-label" for="active">Visible in store</label></div>
    <button class="btn btn-brand">Save</button>
    <a href="{{ url_for('admin.categories') }}" class="btn btn-link">Cancel</a>
  </form>
</div></div>
{% endblock %}
