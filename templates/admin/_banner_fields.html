<form method="post" enctype="multipart/form-data">
  {{ csrf_field() }}
  <div class="mb-2"><label class="form-label small">Title</label><input name="title" class="form-control" value="{{ banner.title or '' }}"></div>
  <div class="mb-2"><label class="form-label small">Subtitle</label><input name="subtitle" class="form-control" value="{{ banner.subtitle or '' }}"></div>
  <div class="mb-2"><label class="form-label small">Image URL</label><input name="image_url" class="form-control" value="{{ banner.image_url or '' }}" placeholder="https://… (1600×500 works best)"></div>
  <div class="mb-2"><label class="form-label small">…or upload image</label><input type="file" name="image_file" accept="image/*" class="form-control"></div>
  <div class="row g-2 mb-2">
    <div class="col-7"><label class="form-label small">Link</label><input name="link" class="form-control" value="{{ banner.link or '' }}" placeholder="/products?category=…"></div>
    <div class="col-5"><label class="form-label small">Button text</label><input name="button_text" class="form-control" value="{{ banner.button_text or '' }}" placeholder="Shop now"></div>
  </div>
  <div class="row g-2 mb-3 align-items-end">
    <div class="col-5"><label class="form-label small">Position</label><input type="number" name="position" min="1" class="form-control" value="{{ banner.position or 1 }}"></div>
    <div class="col-7"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="active" id="bactive" {{ 'checked' if banner.active }}><label class="form-check-label" for="bactive">Live on home page</label></div></div>
  </div>
  <button class="btn btn-brand w-100">{{ 'Save banner' if banner._id else 'Add banner' }}</button>
</form>
